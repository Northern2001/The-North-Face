<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat — Khách</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Trò chuyện với chủ trang</h1>
        <span class="badge">Khách</span>
      </header>
      <p id="status" class="status"></p>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer">
        <textarea
          id="input"
          rows="2"
          maxlength="4000"
          placeholder="Nhập tin nhắn… (Enter gửi, Shift+Enter xuống dòng)"
          aria-label="Nội dung tin nhắn"
        ></textarea>
        <button type="button" class="btn" id="send">Gửi</button>
      </div>
    </div>
    <script type="module" src="js/visitor-app.js"></script>
  </body>
</html>
